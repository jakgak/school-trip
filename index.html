</style></head><body><main class="wrap"><header class="hero"><div>2026 무릉초등학교</div><h1>수학여행 일정 · 결제 확인</h1><p>10월 29일(목) ~ 30일(금) · 학생 15명 / 인솔자 3명</p></header><nav class="tabs"><button id="tab0" onclick="setDay(0)">10/29 목요일</button><button id="tab1" onclick="setDay(1)">10/30 금요일</button></nav><div class="stats"><b id="status"></b><span id="paymentStatus"></span></div><section id="schedule"></section><section class="extra"><h2>별도 확인 항목</h2><div id="extras"></div><div class="actions"><button class="btn" onclick="copyStatus()">결제 현황 복사</button><button class="btn" onclick="resetDay()">일정 체크 초기화</button></div></section><p class="footer">기본 일정 결제 예정액 2,583,000원(버거킹은 최대금액 기준). <br>의약외품 10,000원은 차량 임차료 예산 내 집행. <br>아쿠아플라넷 414,000원은 우천 시 대체 항목. <br>차량 임차료·여행자보험·보조인력 수당은 별도 집행.<br>※ 체크 상태는 해당 기기·브라우저에만 저장되며 다른 기기로 자동 동기화되지 않습니다.</p></main><script>

숙식료(학생)", "note": "15명 × 45,000원", "value": "675,000"}, {"label": "숙식료(교사)", "note": "3명 × 55,000원", "value": "165,000"}]}, {"name": "빛의 섬 루미버스", "amount": "354,000원", "details": [{"label": "입장료(학생)", "note": "15명 × 11,000원", "value": "165,000"}, {"label": "카트투어(학생)", "note": "15명 × 8,000원", "value": "120,000"}, {"label": "입장료(교사)", "note": "3명 × 13,000원", "value": "39,000"}, {"label": "카트투어(교사)", "note": "3명 × 10,000원", "value": "30,000"}]}, {"name": "신화테마파크", "amount": "270,000원", "details": [{"label": "자유이용권(학생)", "note": "15명 × 18,000원", "value": "270,000"}, {"label": "입장료(교사)", "note": "3명 · 무료", "value": "0"}]}, {"name": "푸드코트", "amount": "234,000원", "details": [{"label": "2일차 중식비(학생)", "note": "15명 × 13,000원", "value": "195,000"}, {"label": "2일차 중식비(교사)", "note": "3명 × 13,000원", "value": "39,000"}]}, {"name": "예비비 · 의약외품", "amount": "10,000원", "details": [{"label": "의약외품 구입", "note": "1건 · 차량임차료 예산 내 집행", "value": "10,000"}]}, {"name": "우천시 · 아쿠아플라넷", "amount": "414,000원", "details": [{"label": "입장료(학생)", "note": "15명 × 23,000원", "value": "345,000"}, {"label": "입장료(교사)", "note": "3명 × 23,000원", "value": "69,000"}]}];const mapping={"0": {"2": [0], "4": [1], "6": [2], "8": [3], "12": [5], "9": [4]}, "1": {"3": [6, 7]}};let day=(new Date().getFullYear()===2026&&new Date().getMonth()===9&&new Date().getDate()===30)?1:0;const pkey=i=>'school-trip-payments-2026-v1-'+i;const skey=(d,i)=>'mureung-trip-2026-'+d+'-'+i;let saved={};try{saved=JSON.parse(localStorage.getItem('school-trip-payments-2026-v1')||'{}')}catch(e){}function isPaid(i){return !!saved[i]||localStorage.getItem(pkey(i))==='1'}function setPaid(i,v){saved[i]=v;localStorage.setItem('school-trip-payments-2026-v1',JSON.stringify(saved));localStorage.setItem(pkey(i),v?'1':'0');render()}function mins(t){return +t.slice(0,2)*60 + +t.slice(3)}function setDay(d){day=d;render()}function payHtml(i){let p=payments[i];return `<div class="paybox"><div class="payhead"><span class="paytitle">결제 확인 · ${p.name}</span><label class="payright"><span class="amount">${p.amount}</span><input class="paycheck" type="checkbox" aria-label="${p.name} 결제 완료" data-pay="${i}" ${isPaid(i)?'checked':''}></label></div><div class="details">${p.details.map(x=>`<div class="line"><span>${x.label}<small>${x.note}</small></span><strong>${x.value}</strong></div>`).join('')}</div></div>`}function render(){document.getElementById('tab0').classList.toggle('active',day===0);document.getElementById('tab1').classList.toggle('active',day===1);const t=new Date(),valid=t.getFullYear()===2026&&t.getMonth()===9&&t.getDate()===29+day,now=t.getHours()*60+t.getMinutes();let done=0;document.getElementById('schedule').innerHTML=days[day].map((r,i)=>{let checked=localStorage.getItem(skey(day,i))==='1';if(checked)done++;let current=valid&&now>=mins(r[0])&&(mins(r[1])>mins(r[0])?now<mins(r[1]):true);if(day===0&&i===15)current=valid&&(now>=1350||now<390);let duration=(mins(r[1])-mins(r[0])+1440)%1440;return `<article class="item ${current?'current':''}"><div class="itemhead"><div class="time">${r[0]}–${r[1]}</div><div class="content"><div class="name">${r[2]} ${current?'· 진행 시간':''}</div><div class="desc">${r[3]}</div><div class="duration">${duration}분</div></div><input class="check" type="checkbox" data-schedule="${i}" aria-label="일정 완료" ${checked?'checked':''}></div>${(mapping[day][i]||[]).map(payHtml).join('')}</article>`}).join('');document.getElementById('extras').innerHTML=[8,9].map(payHtml).join('');document.getElementById('status').textContent=`일정 완료 ${done}/${days[day].length}`;document.getElementById('paymentStatus').textContent=`결제 완료 ${payments.filter((_,i)=>isPaid(i)).length}/10`;document.querySelectorAll('[data-pay]').forEach(x=>x.addEventListener('change',()=>setPaid(+x.dataset.pay,x.checked)));document.querySelectorAll('[data-schedule]').forEach(x=>x.addEventListener('change',()=>{localStorage.setItem(skey(day,+x.dataset.schedule),x.checked?'1':'0');render()}))}function resetDay(){if(confirm('현재 날짜의 일정 체크를 초기화할까?')){days[day].forEach((_,i)=>localStorage.removeItem(skey(day,i)));render()}}async function copyStatus(){let txt='2026 수학여행 결제 확인\n'+payments.map((p,i)=>(isPaid(i)?'[완료] ':'[미완료] ')+p.name+' '+p.amount).join('\n');try{await navigator.clipboard.writeText(txt);alert('복사 완료')}catch(e){prompt('복사할 내용',txt)}}render();setInterval(render,60000);
</script></body></html>
